server {
    listen 80;
    server_name localhost;

    # Client body size limit for large aerial uploads
    client_max_body_size 50M;

    # Frontend Single Page Application static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy backend API endpoints
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Reverse proxy uploads, outputs and demo assets
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }

    location /outputs/ {
        proxy_pass http://backend:8000/outputs/;
        proxy_set_header Host $host;
    }

    location /demo_assets/ {
        proxy_pass http://backend:8000/demo_assets/;
        proxy_set_header Host $host;
    }
}
